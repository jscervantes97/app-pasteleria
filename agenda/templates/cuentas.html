{% extends 'base_app.html' %}
{% block content %}
<div class="text-center">
    <h2 class="letraFusia">Cuentas del Mes</h2>
    <h4 id="tituloMes" class="letraMorada"></h4>
</div>
{% csrf_token %}

<div class="mb-3 text-end">
    <a href="/agenda/cuentas/historial" class="btn btnMorado letraBlanca btn-sm">Ver Historial</a>
</div>

<form id="formularioCuenta" style="max-width: 500px; margin: 0 auto;">
    <div class="mb-3">
        <label for="ingreso" class="form-label">Ingreso</label>
        <input type="number" step="0.01" min="0" class="form-control" id="ingreso" name="ingreso" value="0.00">
    </div>
    <div class="mb-3">
        <label for="gasto" class="form-label">Gasto</label>
        <input type="number" step="0.01" min="0" class="form-control" id="gasto" name="gasto" value="0.00">
    </div>
    <div class="mb-3">
        <label for="total" class="form-label">Total (Ingreso - Gasto)</label>
        <input type="text" class="form-control" id="total" name="total" value="0.00" readonly>
    </div>

    <button type="submit" class="btn btnFusia letraBlanca">Guardar</button>
</form>

<script>
const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
const headers = {
    'Content-Type': 'application/json',
    'X-CSRFToken': csrftoken
};

function recalcularTotal() {
    const ingreso = parseFloat(document.getElementById('ingreso').value) || 0;
    const gasto = parseFloat(document.getElementById('gasto').value) || 0;
    document.getElementById('total').value = (ingreso - gasto).toFixed(2);
}

document.getElementById('ingreso').addEventListener('input', recalcularTotal);
document.getElementById('gasto').addEventListener('input', recalcularTotal);

window.onload = async (e) => {
    // Pide (o crea en 0, si es la primera vez que se entra en este mes)
    // el renglon del mes/anio actual -- el backend decide cual es "el
    // mes actual" con su propio reloj, nunca se manda un id desde aqui.
    const cuenta = await restService.get({ url: 'api/cuentas/mesactual/', body: {}, headers });
    document.getElementById('tituloMes').innerText = cuenta.mes_nombre;
    document.getElementById('ingreso').value = cuenta.ingreso;
    document.getElementById('gasto').value = cuenta.gasto;
    recalcularTotal();
};

const formulario = document.getElementById('formularioCuenta');
formulario.addEventListener('submit', async function (event) {
    event.preventDefault();

    const datosJson = {
        ingreso: document.getElementById('ingreso').value,
        gasto: document.getElementById('gasto').value
    };

    const result = await restService.post({ url: 'api/cuentas/mesactual/guardar', body: datosJson, headers });
    console.log(result);

    Swal.fire({
        title: "<strong>Cuenta del mes guardada</strong>",
        icon: "success",
        confirmButtonText: "Aceptar"
    });
});
</script>
{% endblock %}
