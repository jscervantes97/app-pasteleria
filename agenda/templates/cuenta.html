{% extends 'base_app.html' %}
{% load static %}
{% block content %}
<div style="text-align: center;"><h1>{{ tituloForm }}</h1></div>

<form id="formularioCuenta">
  {% csrf_token %}
  <div class="mb-3">
    <label for="fecha" class="form-label">Fecha</label>
    <input type="date" class="form-control" id="fecha" name="fecha" required>
  </div>
  <div class="mb-3">
    <label for="ingreso" class="form-label">Ingreso</label>
    <input type="number" step="0.01" min="0" class="form-control" id="ingreso" name="ingreso" value="0.00" required>
  </div>
  <div class="mb-3">
    <label for="gasto" class="form-label">Gasto</label>
    <input type="number" step="0.01" min="0" class="form-control" id="gasto" name="gasto" value="0.00" required>
  </div>
  <div class="mb-3">
    <label for="total" class="form-label">Total (Ingreso - Gasto)</label>
    <input type="text" class="form-control" id="total" name="total" value="0.00" readonly>
  </div>

  <button type="submit" class="btn btnFusia letraBlanca">Guardar</button>
  <a href="/agenda/cuentas" class="btn btn-secondary">Cancelar</a>
</form>

<script>
let idCuenta = "{{ idCuenta }}";
const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
const headers = {
    'Content-Type': 'application/json',
    'X-CSRFToken': csrftoken
};

function recalcularTotal() {
  const ingreso = parseFloat(document.getElementById('ingreso').value) || 0;
  const gasto = parseFloat(document.getElementById('gasto').value) || 0;
  document.getElementById('total').value = (ingreso - gasto).toFixed(2);
}

document.getElementById('ingreso').addEventListener('input', recalcularTotal);
document.getElementById('gasto').addEventListener('input', recalcularTotal);

window.onload = async (e) => {
  if (idCuenta != "None") {
    let params = {
      url: `api/cuentas/${idCuenta}`,
      body: {},
      headers
    };
    const cuenta = await restService.get(params);
    document.getElementById('fecha').value = cuenta.fecha;
    document.getElementById('ingreso').value = cuenta.ingreso;
    document.getElementById('gasto').value = cuenta.gasto;
    recalcularTotal();
  }
};

const formulario = document.getElementById('formularioCuenta');
formulario.addEventListener('submit', async function (event) {
  event.preventDefault();

  const datosJson = {
    fecha: document.getElementById('fecha').value,
    ingreso: document.getElementById('ingreso').value,
    gasto: document.getElementById('gasto').value
  };

  let params = {
    url: 'api/cuentas/crearactualizar',
    body: datosJson,
    headers
  };

  let result;
  if (idCuenta == "None") {
    result = await restService.post(params);
  } else {
    datosJson['idCuenta'] = idCuenta;
    result = await restService.patch(params);
  }
  console.log(result);

  Swal.fire({
    title: "<strong>Cuenta Guardada Con Éxito</strong>",
    icon: "success",
    showCloseButton: true,
    showCancelButton: false,
    focusConfirm: false,
    confirmButtonText: `
      <a class="btn btn-primary" href="/agenda/cuentas">Aceptar</a>
    `
  });
});
</script>
{% endblock %}
